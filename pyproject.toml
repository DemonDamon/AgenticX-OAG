[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenticx-oag"
version = "0.1.0"
description = "AgenticX-OAG engine: ontology contracts, provider interfaces, and runtime."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "jsonschema",
    "ruff",
    "mypy",
    "types-PyYAML",
]
proto = [
    "protobuf",
    "grpcio-tools",
]
graph = [
    "asyncpg",
]
ingest = [
    "numpy",
]
owl = [
    "rdflib>=7",
    "pyshacl>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["agenticx_oag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests are additionally guarded by TEST_PG_DSN skipif so that
# `pytest tests/graph/test_age_store.py` runs them when the env var is set;
# the default suite deselects them via the explicit `-m "not integration"`.
markers = [
    "integration: integration tests that require external services (docker compose)",
]

[tool.ruff]
extend-exclude = ["agenticx_oag/contracts/gen"]

[tool.mypy]
files = ["agenticx_oag"]
exclude = ["agenticx_oag/contracts/gen"]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true
