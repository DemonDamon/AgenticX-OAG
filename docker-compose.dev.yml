services:
  age:
    image: apache/age:release_PG16_1.6.0
    container_name: agenticx-oag-age
    environment:
      POSTGRES_USER: agenticx
      POSTGRES_PASSWORD: agenticx
      POSTGRES_DB: agenticx
    ports:
      # 宿主 5433 避让本机其他项目的 5432 实例
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticx -d agenticx"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: agenticx-oag-redis
    ports:
      # 宿主 6380 避让本机其他项目的 6379 实例
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
