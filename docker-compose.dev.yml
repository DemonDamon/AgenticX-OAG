services:
  age:
    image: apache/age:release_PG16_1.6.0
    container_name: agenticx-age
    environment:
      POSTGRES_USER: agenticx
      POSTGRES_PASSWORD: agenticx
      POSTGRES_DB: agenticx
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticx -d agenticx"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: agenticx-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
