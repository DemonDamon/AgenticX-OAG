name: CI

on: [push, pull_request]

jobs:
  check:
    name: lint / type-check / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev and proto extras
        run: python -m pip install -e ".[dev,proto]"
      - name: Ruff
        run: ruff check agenticx_oag tests
      - name: Mypy
        run: mypy agenticx_oag
      - name: Pytest (unit layer)
        run: pytest tests/ -m "not integration"
